<div class="shell"><aside class="side"><div class="brand"><span class="mark">∞</span>伴随</div><div class="eyebrow">FEISHU EXPERIENCE / V2</div><nav class="sidenav" id="sidenav" aria-label="场景"></nav><div class="sidefoot">一个秘书，随时接得上。<br>2026.11.18 · 设计提案<br><br>示例数据，本页本地演示。<br>尚未替换正在运行的 MVP。</div></aside><main class="main"><header class="top"><div><div class="small muted">伴随式 AI / 飞书交互</div><h1>把事情接着做下去。</h1></div><span class="badge">● 设计原型 · 示例数据</span></header><div class="tabs" role="tablist" aria-label="内容视图"><button role="tab" data-view="prototype">可点击原型</button><button role="tab" data-view="gallery">十二屏图册</button><button role="tab" data-view="research">接入调研</button></div><div id="content"></div></main></div><dialog id="dialog" aria-label="演示详情"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const flows={A:{name:'招募与交接',desc:'秘书自然发现需求，专业助理接手同一件事。',steps:['秘书提出建议','开通并完成交接','在独立会话继续'],file:'01-recruit-and-handoff.png',rules:['默认一个秘书，持续的专业需求才建议招人。','先确认职责、开通并核验，再交接；不会凭空出现一个已可用机器人。','上下文由明确交接接续，打开会话后沿用同一项任务。']},B:{name:'进度与交付',desc:'知道做到哪一步，只在需要你时出现。',steps:['任务正在运行','补充必要信息','交付后继续'],file:'02-progress-and-delivery.png',rules:['原卡显示真实阶段和更新时间，不编造进度百分比。','你补充的信息有接收回执，继续的是原任务。','文件原生预览；回到秘书汇总也不重新开工。']},C:{name:'任务与记录',desc:'固定的轻入口，需要深入时再展开。',steps:['全部任务','任务详情','记一下'],file:'03-task-list-and-capture.png',rules:['角色来自实际团队，三个状态统一查看。','看进度留在秘书会话，深入讨论再找负责人。','随手记录先保存，默认不创建任务。']},D:{name:'解雇与并回',desc:'角色可以来去，工作、记忆和成果留下。',steps:['告诉秘书接回来','核对交接清单','并回后继续'],file:'04-retire-and-merge.png',rules:['先停新派单，等本轮进入可交接状态。','未完成任务、记忆和成果有具体清单，可核对后一次确认。','先完成内部交接，再停用平台应用；失败分别重试。']}};
const roleNames={secretary:'伴随秘书',quant:'量化助理',product:'产品助理',life:'生活助理'};
const tasks=[{id:'q1',title:'验证低换手选股假设',owner:'quant',status:'running',stage:'校验历史样本',next:'计算交易成本'},{id:'p1',title:'实现安卓悬浮记录入口',owner:'product',status:'running',stage:'完善记录面板',next:'检查系统分享流程'},{id:'q2',title:'补充回测样本',owner:'quant',status:'pending',stage:'等待当前研究结果',next:'整理缺失样本'},{id:'l1',title:'补充出行日期',owner:'life',status:'pending',stage:'待你补充',next:'确定出行日期'},{id:'s1',title:'整理阅读资料与笔记',owner:'secretary',status:'pending',stage:'已收下资料',next:'归类阅读主题'},{id:'l2',title:'安排周末出行',owner:'life',status:'pending',stage:'等待出行日期',next:'整理行程备选'},{id:'q3',title:'整理研究问题清单',owner:'quant',status:'done',stage:'已完成',next:'可继续讨论'},{id:'s2',title:'整理本周收藏资料包',owner:'secretary',status:'done',stage:'已完成',next:'可继续讨论'}];
const state={view:'prototype',flow:'A',step:0,role:'secretary',env:'normal',hire:'confirm',filter:'running',roleFilter:'all',page:0,task:'q1',current:{secretary:'s1',quant:'q1',product:'p1',life:'l1'},period:'近五年',requirements:'排除上市不足一年的股票',note:'周末看看这篇关于研究方法的文章',link:'',files:[],saved:false,retired:false,merged:false,mergePending:false,messages:[]};
const t=()=>tasks.find(x=>x.id===state.task)||tasks[0],statusName=s=>({running:'运行中',pending:'未完成',done:'已完成'}[s]),avatar=r=>`<span class="avatar ${r==='quant'?'quant':''}">${r==='quant'?'▥':'∞'}</span>`;
const btn=(label,action,primary=false,extra='')=>`<button class="btn ${primary?'primary':''}" data-action="${action}" ${extra}>${label}</button>`;
const card=(title,body)=>`<section class="card"><div class="cardhead">${title}</div><div class="cardbody">${body}</div></section>`;
const msg=(s,user=false)=>`<div class="msg ${user?'user':''}">${user?'':avatar(state.role)}<div class="bubble">${esc(s)}</div></div>`;
const titleTask=()=>`<strong class="title">${esc(t().title)}</strong>`,pill=(s)=>`<span class="pill ${s==='pending'?'amber':''}">${statusName(s)}</span>`;
const menu=()=>state.role==='secretary'?`<button data-action="tasks">☷ 我的任务</button><button data-action="capture">✎ 记一下</button><button data-action="team">⊞ 助理</button>`:`<button data-action="current">▱ 当前任务</button><button data-action="tasks">☷ 我的任务</button><button data-action="secretary">∞ 找秘书</button>`;
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',4300)}
function modal(title,body,actions=''){const d=$('#dialog');d.className='';d.innerHTML=`<div class="modalhead"><h3>${title}</h3><button data-action="close" aria-label="关闭">×</button></div>${body}${actions}`;if(!d.open)d.showModal()}
function goto(flow,step,role){state.flow=flow;state.step=step;if(flow==='B'){t().status=step===2?'done':step===1?'pending':'running';if(step===2)t().stage='已完成';else if(step===1)t().stage='待你补充';else if(['已完成','待你补充'].includes(t().stage))t().stage='处理本轮要求'}if(role)state.role=role;else state.role=flow==='B'||(flow==='A'&&step===2)?t().owner:'secretary';state.messages=[];render()}
function gate(){if(state.env==='offline'){toast('未提交：执行设备离线。电脑在线后请重试。');return false}if(state.env==='stale'){toast('这是历史卡片，请获取最新状态后再操作。');return false}if(state.env==='approval'){modal('需要到电脑处理',`<p>这一步需要在 Codex 或系统的实际授权界面完成。</p><p>飞书中的业务确认不能代替系统授权。任务会保留当前进度。</p>`,`<div class="buttons">${btn('知道了，保留进度','close',true)}</div>`);return false}return true}
function hireScreen(){if(state.hire==='ready')return card('✓ 量化助理已就位',`<p>平台开通与收发核验完成。</p><hr class="divider">${titleTask()}<p>任务与资料已交接。秘书继续关注进度。</p><div class="buttons stack">${btn('和量化助理聊','open-quant',true)}${btn('查看交接','handoff')}</div>`);return card('还差一步 · 确认应用开通',`<p>已准备好助理名称、职责与所需权限。</p><ol class="stages"><li><b>✓</b> 角色职责已确定</li><li><b>●</b> 等待你确认平台开通</li><li><b>○</b> 检查发布、连接与收发</li><li><b>○</b> 交接任务与相关资料</li></ol><div class="buttons">${btn('去确认开通','authorize',true)}${btn('稍后继续','later')}</div><p class="hint">需要管理员审核时，会保留进度并等它生效。</p>`)}
function taskDetail(){return card('任务详情',`${titleTask()}${pill(t().status)}<div class="kv"><span>负责人</span><span>${roleNames[t().owner]}</span></div><div class="kv"><span>当前阶段</span><span>${esc(t().stage)}</span></div><div class="kv"><span>下一步</span><span>${esc(t().next)}</span></div><p class="hint">${state.task==='q1'?'已确认：'+esc(state.period)+'，'+esc(state.requirements)+'。':'这项任务的资料与进展会随任务一起接续。'}</p><div class="buttons">${btn('和负责人聊','open-owner',true)}${btn('补充要求','supplement')}</div>`)}

llbacks" target="_blank" rel="noreferrer">官方接入</a></td><td>目前仅消息事件</td></tr><tr><td>离线与旧卡</td><td>无回执不能显示成功；JSON 2.0 卡片交互和更新有 14 天期限，菜单取最新。<a href="https://open.feishu.cn/document/feishu-cards/card-json-v2-breaking-changes-release-notes" target="_blank" rel="noreferrer">版本边界</a></td><td>待补恢复与校验</td></tr><tr><td>跨角色上下文</td><td>不同应用身份、聊天可见范围有边界。通过内部任务和显式交接接续。</td><td>一个 bot 内的静态角色</td></tr><tr><td>手机 HTML 看板</td><td>需要设备可达地址与鉴权；手机 localhost 无法打开电脑看板。</td><td>本机看板非手机终端</td></tr><tr><td>任务 / 文档 / 日历</td><td>可选扩展，单独授权。原生任务智能体注册不等于创建聊天机器人。</td><td>未接入这些业务</td></tr></tbody></table></div><h2>从用户眼前的操作接回任务</h2><div class="flowline"><span>自然聊天</span><i>→</i><span>秘书理解与安排</span><i>→</i><span>需要时专业助理</span><i>→</i><span>同一任务 / 资料</span><i>→</i><span>秘书汇报与记忆积累</span></div><p>专业助理之间按任务和资料授权。秘书在委托范围内管理团队；用户设定的私密范围继续保留。更换机器人不会自动提供数据隔离，也不会自动打通聊天历史。</p><div class="footerlinks"><a href="飞书接入调研.md">完整调研与逐项来源 ↗</a><a href="交互规格.md">完整交互规格 ↗</a><a href="README.md">交付说明 ↗</a></div></article>`}
function doAction(action,el){if(action==='close'){$('#dialog').close();return}if(action==='refresh'){if(state.env==='offline'){toast('设备仍离线，请在线后重试。');return}state.env='normal';render();toast('已获取最新状态（演示）。');return}if(action==='next'||action==='previous'){let step=Math.max(0,Math.min(2,state.step+(action==='next'?1:-1)));if(state.flow==='D'&&step===2){toast('先在交接清单确认，再查看并回结果。');return}goto(state.flow,step);return}if(state.env==='stale'&&['tasks','current','capture','team'].includes(action))state.env='normal';if(!gate())return;
switch(action){case 'recruit':state.hire=state.retired?'confirm':state.hire;goto('A',1,'secretary');break;case 'authorize':modal('确认开通 · 演示',`<p>实际产品会在这里提供官方确认链接或二维码，保留已准备的角色信息。</p><p>确认后仍需检查发布、可用范围、连接、菜单与收发。此演示用下方按钮进入核验通过后的状态。</p>`,`<div class="buttons">${btn('模拟确认并通过核验','verified',true)}</div>`);break;case 'verified':$('#dialog').close();state.hire='ready';state.retired=false;tasks[0].owner='quant';goto('A',1,'secretary');toast('开通核验通过，已交接同一任务（演示）。');break;case 'handoff':modal('已交接的内容',`<p><b>验证低换手选股假设</b></p><p>研究范围、交易成本要求、相关资料索引及任务摘要；无需复制所有私人聊天。</p><p>目标会话已定位这项任务，秘书保留管理与汇报入口。</p>`,`<div class="buttons">${btn('和量化助理聊','open-quant',true)}</div>`);break;case 'open-quant':if($('#dialog').open)$('#dialog').close();state.current.quant=state.task;goto('A',2,'quant');break;case 'keep-secretary':tasks[0].owner='secretary';goto('C',1,'secretary');toast('继续由秘书负责，没有创建新角色。');break;case 'tasks':state.roleFilter=state.role==='secretary'?'all':state.role;state.page=0;goto('C',0,state.role);break;case 'capture':state.saved=false;state.noteTask=null;goto('C',2,'secretary');break;case 'open-role':{const role=el?.dataset.role||'quant';const candidate=tasks.find(x=>x.id===state.current[role]&&x.owner===role)||tasks.find(x=>x.owner===role);if(candidate){state.task=candidate.id;state.current[role]=candidate.id;if($('#dialog').open)$('#dialog').close();goto('B',candidate.status==='done'?2:0,role);}else{if($('#dialog').open)$('#dialog').close();state.roleFilter=role;goto('C',0,role);}break;}case 'current':{const candidate=tasks.find(x=>x.id===state.current[state.role])||tasks.find(x=>x.owner===state.role);if(candidate){state.task=candidate.id;goto('B',candidate.status==='done'?2:0,state.role)}else goto('C',0,state.role);break;}case 'secretary':case 'summary':goto('C',1,'secretary');toast('已把同一任务带回秘书会话。');break;case 'progress':goto('B',0,state.role);break;case 'supplement':goto('B',1,state.role);break;case 'filter':state.filter=el.dataset.value;state.page=0;render();break;case 'detail':state.task=el.dataset.id;goto('C',1,state.role);break;case 'open-owner':state.current[t().owner]=state.task;goto('B',t().status==='done'?2:0,t().owner);toast('已选中这项任务，并进入负责人的会话。');break;case 'page-prev':state.page=Math.max(0,state.page-1);render();break;case 'page-next':state.page++;render();break;case 'continue':t().status='running';goto('B',0,t().owner);toast('沿用当前任务继续研究。');break;case 'file-preview':modal('研究报告预览 · 示例',`<p><b>低换手研究报告.pdf</b></p><p>研究范围：${esc(state.period)}。</p><p>这份演示只展示文件交付方式，不包含真实回测结果。实际成果作为飞书原生文件消息发送，使用客户端预览。</p>`,`<div class="buttons">${btn('返回任务','close',true)}</div>`);break;case 'new-note':state.saved=false;state.note='';state.link='';state.files=[];state.noteTask=null;render();break;case 'process-note':state.saved=true;if(!state.noteTask){state.noteTask='note-'+tasks.length;tasks.push({id:state.noteTask,title:'整理刚登记的阅读资料',owner:'secretary',status:'pending',stage:'已收到登记资料',next:'按主题整理资料'});}state.task=state.noteTask;goto('C',1,'secretary');toast('已交给秘书，并关联到刚登记的资料。');break;case 'later':toast('已保留当前进度，可以稍后从固定菜单继续。');break;case 'wait-round':goto('D',1,'secretary');toast('演示本轮结束后：进入可核对的交接清单。');break;case 'desktop-stop':modal('到电脑处理当前执行',`<p>可以等待当前轮结束，或在 Codex 中使用实际可用的停止操作。确认执行已结束后再交接，避免两份执行同时推进。</p>`,`<div class="buttons stack">${btn('演示本轮已结束','round-finished',true)}${btn('取消交接','cancel-merge')}</div>`);break;case 'round-finished':$('#dialog').close();goto('D',1,'secretary');break;case 'cancel-merge':$('#dialog').close();goto('C',0,'secretary');break;case 'merge':state.merged=true;state.retired=true;state.mergePending=state.env==='retire-failed';tasks.filter(x=>x.owner==='quant').forEach(x=>{x.owner='secretary';if(x.status==='running'){x.status='pending';x.stage='已交接，等待继续'}});state.roleFilter='all';goto('D',2,'secretary');toast(state.mergePending?'交接已完成，平台停用待处理。':'工作已并回，角色已移除（演示）。');break;case 'retry-retire':state.mergePending=false;state.env='normal';render();toast('演示重试停用成功，已交接任务保持不变。');break;case 'resume-merged':goto('C',1,'secretary');break;case 'team':modal('我的助理',`<p><b>伴随秘书</b> · 理解你、亲自执行、管理与汇报</p><p>${state.retired?'量化助理 · 已并回秘书':'量化助理 · 研究与回测'}</p><p>产品助理 · 软件与平台<br>生活助理 · 日常安排</p><p class="small muted">本例展示团队形态。日常可以始终只用一个秘书。</p>`,`<div class="buttons stack">${state.retired?'':btn('与量化助理聊','open-role',true,'data-role="quant"')}${btn('请秘书接回量化工作','retire')}${btn('关闭','close')}</div>`);break;case 'retire':$('#dialog').close();state.task='q1';goto('D',0,'secretary');break;case 'attachment':modal('这份附件用在哪里？',`<p>记录模式下归入本批资料；普通对话下优先关联当前任务，意图不清楚时让你选一次。</p>`,`<div class="buttons stack">${btn('记为独立资料','capture',true)}${btn('用于当前任务','attach-task')}</div>`);break;case 'attach-task':$('#dialog').close();toast('附件将归入当前任务（这里只演示归属选择）。');break;default:break}}
document.addEventListener('click',event=>{const target=event.target.closest('button,a');if(!target)return;if(target.dataset.view){state.view=target.dataset.view;render();return}if(target.dataset.flow){event.preventDefault();state.view='prototype';if(target.dataset.flow==='A'||target.dataset.flow==='D')state.task='q1';goto(target.dataset.flow,0);return}if(target.dataset.step!==undefined){const step=Number(target.dataset.step);if(state.flow==='D'&&step===2&&!state.merged){toast('请先确认交接清单，再查看并回结果。');return}goto(state.flow,step);return}if(target.dataset.image){const d=$('#dialog');d.className='zoom';d.innerHTML=`<div class="modalhead"><span>效果图 · 点击右侧关闭</span><button data-action="close" aria-label="关闭">×</button></div><img src="${target.dataset.image}" alt="放大的完整交互图">`;d.showModal();return}if(target.dataset.action){event.preventDefault();if(target.dataset.action==='capture'&&$('#dialog').open)$('#dialog').close();doAction(target.dataset.action,target)}});
document.addEventListener('change',event=>{if(event.target.id==='environment'){state.env=event.target.value;render()}if(event.target.id==='roleFilter'){state.roleFilter=event.target.value;state.page=0;render()}if(event.target.id==='attachments'){state.files=Array.from(event.target.files).map(f=>f.name)}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='captureForm'){state.note=$('#note').value;state.link=$('#noteLink').value;if(!gate())return;state.saved=true;render();toast('已保存到资料；没有创建任务。')}if(event.target.id==='supplementForm'){state.requirements=$('#requirements').value;if($('#period'))state.period=$('#period').value;if(!gate())return;t().status='running';goto('B',0,state.role);toast('已接收补充要求，继续同一任务。')}if(event.target.id==='chatForm'){const input=$('#chatInput'),text=input.value.trim();if(!text)return;if(!gate())return;state.messages.push({text,user:true},{text:state.flow==='C'&&state.step===2?'已加入本次记录草稿，请点保存完成登记。':'已收到，沿用当前任务与上下文继续。',user:false});if(state.flow==='C'&&state.step===2){state.note+=(state.note?'\n':'')+text}render();$('.chat').scrollTop=$('.chat').scrollHeight}});
render();
